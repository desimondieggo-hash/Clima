name: Publicar
# Publica la app en GitHub Pages y actualiza las alertas del SMN cada 15 minutos.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons _site/
          cp alerts.json _site/alerts.json
          touch _site/.nojekyll
      - name: Alertas del SMN
        run: python3 scripts/smn_alerts.py _site/alerts.json || echo "No se pudieron leer las alertas; queda la versión vacía."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
